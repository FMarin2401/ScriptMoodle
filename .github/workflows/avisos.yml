name: Avisos de Moodle

on:
  schedule:
    # Cada hora, en el minuto 7 (hora UTC). Se evita el minuto 0 porque
    # es el más saturado en GitHub y ahí los retrasos son mayores.
    - cron: "7 * * * *"
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

# Nunca dos ejecuciones a la vez: compartirían la misma libreta.
concurrency:
  group: avisos-moodle
  cancel-in-progress: false

# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        # --locked falla si uv.lock no coincide con pyproject.toml
        run: uv sync --locked

      - name: Restaurar la libreta de avisos
        uses: actions/cache/restore@v4
        with:
          path: avisados.json
          key: libreta-${{ github.run_id }}
          restore-keys: libreta-

      - name: Revisar Moodle
        run: uv run moodle_avisos.py
        env:
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Guardar la libreta de avisos
        # always(): también se guarda si el script falló, para no repetir
        # la alerta de error cada hora. hashFiles evita fallar si no existe.
        if: always() && hashFiles('avisados.json') != ''
        uses: actions/cache/save@v4
        with:
          path: avisados.json
          key: libreta-${{ github.run_id }}
